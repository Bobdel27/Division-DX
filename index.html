<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divisions DX 11m - 27MHz</title>
<style>
  :root{
    --bg:#0a0f16; --panel:#141d29; --panel2:#0f1720; --line:#26344a;
    --text:#eef3f9; --muted:#8ea1b8; --accent:#3ea6ff; --accent2:#ffb020;
    --glow:0 0 0 1px #ffffff10, 0 8px 24px -8px #000a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;}
  ::-webkit-scrollbar{display:none;}
  *{scrollbar-width:none;}
  body{
    margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #1a2a3f55 0%, transparent 45%),
      radial-gradient(circle at 85% 100%, #1a2a3f55 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    padding:24px;
    min-height:100vh;
  }
  h1{
    font-size:2.1rem; margin:0 0 24px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .layout{
    display:flex; gap:18px; align-items:stretch;
    height:calc(100vh - 100px); height:calc(100dvh - 100px); min-height:480px;
  }
  .divider{
    width:28px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(180deg, var(--accent), #1c2a3c);
    opacity:0.5;
    position:relative;
  }
  .divider::after{
    content:"";
    position:absolute; top:8px; right:8px; bottom:8px; left:8px;
    border-radius:10px;
    background:linear-gradient(180deg, #ffffffcc, var(--accent2));
    opacity:0.8;
  }
  .left{
    width:33.333%; flex-shrink:0; padding:28px 22px;
    background:linear-gradient(180deg, var(--panel2), #0c131c);
    border:1px solid var(--line); border-radius:22px;
    display:flex; flex-direction:column; gap:24px;
    overflow-y:auto;
    box-shadow:var(--glow);
  }
  .right{
    flex:2; padding:28px; overflow-y:auto;
    background:var(--panel2);
    border:1px solid var(--line); border-radius:22px;
    box-shadow:var(--glow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .right.has-result{padding:0;}
  .subtitle{color:var(--muted); font-size:0.8rem; margin-bottom:6px; line-height:1.4;}

  .field label{
    display:block; font-size:0.85rem; color:var(--muted); margin-bottom:8px;
    text-transform:uppercase; letter-spacing:0.5px; font-weight:600;
    text-align:center;
  }
  .search{
    width:100%; padding:15px 16px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel); color:var(--text);
    font-size:1.05rem; outline:none; transition:border-color .15s, box-shadow .15s;
    text-align:center;
  }
  .search:focus{border-color:var(--accent); box-shadow:0 0 0 4px #3ea6ff22;}

  .clear-btn{
    width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-size:0.9rem; cursor:pointer; font-weight:600;
    transition:border-color .15s, color .15s;
  }
  .clear-btn:hover{border-color:var(--accent2); color:var(--accent2);}

  .btn-search{
    background:#123420; border-color:#22c55e; color:#5cf29a;
    box-shadow:0 0 5px 0px #22c55e66;
  }
  .btn-search:hover{
    background:#0e2a17; border-color:#15c94a; color:#a8ffc6;
    box-shadow:0 0 8px 1px #22c55e88;
  }

  .btn-clear-all{
    background:#3a1218; border-color:#ef4444; color:#ff8a92;
    box-shadow:0 0 5px 0px #ef444466;
  }
  .btn-clear-all:hover{
    background:#2a0e10; border-color:#ff2e3f; color:#ffc3c8;
    box-shadow:0 0 8px 1px #ef444488;
  }
  .count{color:var(--muted); font-size:0.82rem; margin-bottom:16px; letter-spacing:0.3px; text-align:center;}

  /* Résultat unique en grand format */
  .hero{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:linear-gradient(135deg, #17263a, #101a26);
    border-radius:22px;
    width:100%; height:100%;
    box-shadow:var(--glow);
    text-align:center;
    padding:10px;
  }
  .hero .flag{
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .hero .flag-img{
    max-width:100%; max-height:100%; width:auto; height:auto;
    border-radius:24px; box-shadow:0 0 0 1px #ffffff22, 0 24px 60px -10px #000;
    object-fit:contain;
  }
  .hero .flag-fallback{font-size:22rem;}
  .hero-info{
    min-width:0; flex-shrink:0;
    background:#1c2a3c66;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 36px;
    margin:0 12px;
  }
  .hero-num{
    display:inline-block; background:#1c2a3c; color:var(--accent2);
    font-size:1.3rem; font-weight:700; padding:6px 18px; border-radius:12px;
    margin-bottom:8px; letter-spacing:0.5px;
  }
  .hero-name{font-size:3.2rem; font-weight:700; line-height:1.1;}

  #rows{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:12px; width:100%; align-content:flex-start;
  }
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:13px; padding:13px 15px;
    box-shadow:var(--glow);
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .flag{width:38px; height:28px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .flag-img{width:36px; height:auto; border-radius:4px; display:block; box-shadow:0 0 0 1px #ffffff22;}
  .flag-fallback{font-size:1.6rem; line-height:1;}
  .flag svg.flag-img{width:36px; height:auto; border-radius:4px; display:block; box-shadow:0 0 0 1px #ffffff22;}
  .hero .flag svg.flag-img{max-width:100%; max-height:100%; width:auto; height:auto; border-radius:24px; box-shadow:0 0 0 1px #ffffff22, 0 24px 60px -10px #000;}
  .info{min-width:0;}
  .num{
    display:inline-block; background:#1c2a3c; color:var(--accent2);
    font-size:0.72rem; font-weight:700; padding:1px 7px; border-radius:6px;
    margin-bottom:4px;
  }
  .name{font-size:0.95rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .empty{
    color:var(--muted); text-align:center; padding:80px 20px; font-size:0.95rem;
    border:1px dashed var(--line); border-radius:16px; max-width:480px;
  }
  .empty-icon{font-size:2.2rem; margin-bottom:10px; opacity:0.6;}
  #q-country{text-transform:uppercase;}

  .map-wrap{
    position:relative; width:100%; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:#0c131c; line-height:0;
  }
  .map-wrap img{width:100%; display:block; opacity:0.9;}
  .map-marker{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:#ff2e3f; border:1px solid #fff; transform:translate(-50%,-50%);
    box-shadow:0 0 5px 1.5px #ff2e3faa; display:none;
  }
  .map-note{color:var(--muted); font-size:0.75rem; text-align:center; margin-top:6px;}
  .country-info{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;
  }
  .country-info .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; text-align:center;
  }
  .country-info .stat-label{color:var(--muted); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:3px;}
  .country-info .stat-value{font-size:0.9rem; font-weight:600;}

  /* Tablette (iPad portrait/paysage) */
  @media (max-width: 1024px){
    body{padding:16px;}
    .left{width:38%; padding:22px 16px;}
    .hero-name{font-size:2.4rem;}
    .hero-num{font-size:1.1rem;}
  }

  /* Mobile (iPhone SE et similaires) */
  @media (max-width: 720px){
    body{padding:10px;}
    h1{font-size:1.3rem; margin:0 0 14px; gap:8px;}
    .layout{flex-direction:column; height:auto; gap:12px;}
    .left{width:100%; border-right:none; border-bottom:1px solid var(--line); padding:16px 14px; gap:16px; overflow-y:visible;}
    .right{padding:16px; min-height:60vh; min-height:60dvh;}
    .right.has-result{padding:0;}
    .divider{display:none;}
    .hero{max-width:100%; flex-wrap:wrap; padding:14px;}
    .hero-name{font-size:1.6rem;}
    .hero-num{font-size:0.95rem; padding:5px 12px;}
    .hero-info{padding:12px 18px; margin:0;}
    .hero .flag-fallback{font-size:8rem;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px;}
    .card{padding:10px 12px; gap:12px;}
    .flag{width:60px; height:44px;}
    .flag-img, .flag svg.flag-img{width:58px;}
    .flag-fallback{font-size:2.2rem;}
    .name{font-size:1rem;}
    .country-info{grid-template-columns:1fr 1fr; gap:6px;}
    .country-info .stat{padding:6px 8px;}
    .country-info .stat-value{font-size:0.8rem;}
  }

  @media (max-width: 400px){
    .hero-name{font-size:1.3rem;}
    .grid{grid-template-columns:1fr 1fr;}
    .flag{width:70px; height:52px;}
    .flag-img, .flag svg.flag-img{width:68px;}
  }
</style>
</head>
<body>
<h1>📡 Divisions DX 11 mètres — 27 MHz</h1>
<div class="layout">
  <div class="left">
    <div class="field">
      <label for="q-num">Recherche par numéro</label>
      <input class="search" id="q-num" placeholder="Ex: 14, 44, 201...">
      <button class="clear-btn btn-search" id="search-num-btn" style="margin-top:8px;">Rechercher</button>
    </div>
    <div class="field">
      <label for="q-country">Recherche par pays</label>
      <input class="search" id="q-country" placeholder="Ex: France, Brésil, Japon...">
      <button class="clear-btn btn-search" id="search-country-btn" style="margin-top:8px;">Rechercher</button>
    </div>
    <button class="clear-btn btn-clear-all" id="clear-btn">Effacer</button>

    <div class="field">
      <label>Position sur la carte</label>
      <div class="map-wrap">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Equirectangular_projection_SW.jpg" alt="Carte du monde">
        <div class="map-marker" id="map-marker"></div>
      </div>
      <div class="map-note" id="map-note"></div>
      <div class="country-info" id="country-info"></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="right">
    <div class="count" id="count"></div>
    <div id="rows">
      <div class="empty">
        <div class="empty-icon">📻</div>
        Tapez un numéro ou un nom de pays pour afficher les résultats
      </div>
    </div>
  </div>
</div>

const mapNote = document.getElementById('map-note');
function updateMap(cc, num){
  const ex = DIV_EXTRA[num];
  const c = ex ? [ex[0], ex[1]] : centroids[(cc||'').toLowerCase()];
  if(!c){
    mapMarker.style.display = 'none';
    mapNote.textContent = 'Position inconnue sur la carte';
    return;
  }
  const [lat, lon] = c;
  mapMarker.style.left = ((lon + 180) / 360 * 100) + '%';
  mapMarker.style.top = ((90 - lat) / 180 * 100) + '%';
  mapMarker.style.display = 'block';
  mapNote.textContent = '';
}
function clearMap(){
  mapMarker.style.display = 'none';
  mapNote.textContent = '';
}

function fmtNum(n){
  if(n === null || n === undefined) return '—';
  return Math.round(n).toLocaleString('fr-FR');
}
function statsHtml(info){
  return `<div class="stat"><div class="stat-label">Population</div><div class="stat-value">${info.population ? fmtNum(info.population) : '—'}</div></div>
    <div class="stat"><div class="stat-label">Superficie</div><div class="stat-value">${info.area ? fmtNum(info.area)+' km²' : '—'}</div></div>
    <div class="stat"><div class="stat-label">Continent</div><div class="stat-value">${info.continent || '—'}</div></div>
    <div class="stat"><div class="stat-label">Décalage horaire</div><div class="stat-value">${info.tz || '—'}</div></div>`;
}
function updateCountryInfo(cc, num){
  const ex = DIV_EXTRA[num];
  if(ex){ countryInfoEl.innerHTML = statsHtml({population:ex[2], area:ex[3], continent:ex[4], tz:ex[5]}); return; }
  const code = (cc||'').toLowerCase();
  if(!code){ countryInfoEl.innerHTML = ''; return; }
  if(MANUAL_INFO[code]){ countryInfoEl.innerHTML = statsHtml(MANUAL_INFO[code]); return; }
  const d = COUNTRY_INFO[code];
  if(d){
    countryInfoEl.innerHTML = statsHtml({population:d[0], area:d[1], continent:d[2], tz:d[3]});
  } else {
    countryInfoEl.innerHTML = statsHtml({});
  }
}

function flagHtml(cc){
  if(!cc) return `<span class="flag-fallback">📡</span>`;
  if(SVG_FLAGS[cc]) return SVG_FLAGS[cc];
  return `<img class="flag-img" src="https://flagcdn.com/w1280/${cc}.png"
          alt="" loading="lazy"
          onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'flag-fallback',textContent:'📡'}))">`;
}
function cardHtml(r){
  return `<div class="card"><div class="flag">${flagHtml(r[2])}</div><div class="info">
    <div class="num">Div. ${r[0]}</div><div class="name">${r[1]}</div></div></div>`;
}
function heroHtml(r){
  return `<div class="hero"><div class="flag">${flagHtml(r[2])}</div><div class="hero-info">
    <div class="hero-num">Division ${r[0]}</div><div class="hero-name">${r[1]}</div></div></div>`;
}

function normalize(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim().toLowerCase();
}

function render(){
  const vNum = qNum.value.trim().toLowerCase();
  const vCountry = normalize(qCountry.value.trim());

  if(!vNum && !vCountry){
    rightEl.classList.remove('has-result');
    rowsEl.innerHTML = `<div class="empty"><div class="empty-icon">📻</div>Tapez un numéro ou un nom de pays pour afficher les résultats</div>`;
    countEl.textContent = '';
    clearMap();
    countryInfoEl.innerHTML = '';
    return;
  }

  let list = data;
  if(vNum) list = list.filter(r => r[0].toLowerCase() === vNum);
  if(vCountry) list = list.filter(r => normalize(r[1]).includes(vCountry));

  if(!list.length){
    rightEl.classList.remove('has-result');
    rowsEl.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>Aucun résultat</div>`;
    countEl.textContent = '';
    clearMap();
    countryInfoEl.innerHTML = '';
    return;
  }

  if(list.length === 1){
    rightEl.classList.add('has-result');
    countEl.textContent = '';
    rowsEl.innerHTML = heroHtml(list[0]);
    updateMap(list[0][2], list[0][0]);
    updateCountryInfo(list[0][2], list[0][0]);
  } else {
    rightEl.classList.remove('has-result');
    rowsEl.innerHTML = `<div class="grid">${list.map(cardHtml).join('')}</div>`;
    countEl.textContent = list.length + ' résultats';
    clearMap();
    countryInfoEl.innerHTML = '';
  }
}

let numDebounce;
qNum.addEventListener('input', () => {
  clearTimeout(numDebounce);
  if(qNum.value.trim() === ''){ render(); }
});
document.getElementById('search-num-btn').addEventListener('click', render);
qNum.addEventListener('keydown', (e) => { if(e.key === 'Enter') render(); });

qCountry.addEventListener('input', () => {
  if(qCountry.value.trim() === ''){ render(); }
});
document.getElementById('search-country-btn').addEventListener('click', render);
qCountry.addEventListener('keydown', (e) => { if(e.key === 'Enter') render(); });

document.getElementById('clear-btn').addEventListener('click', () => {
  qNum.value = '';
  qCountry.value = '';
  clearMap();
  countryInfoEl.innerHTML = '';
  render();
});
</script>
